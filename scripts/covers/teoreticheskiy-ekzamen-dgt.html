<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { --glow: #dbeafe; }
  .scr { left: 200px; top: 120px; width: 760px; padding: 40px 44px; transform: rotate(-2deg); }
  .top { display: flex; justify-content: space-between; font-size: 18px; color: var(--muted); font-weight: 600; }
  .bar { height: 8px; background: #f1f5f9; border-radius: 4px; margin: 16px 0 28px; } .bar i { display: block; height: 8px; width: 60%; background: var(--ink); border-radius: 4px; }
  .q { font-size: 30px; font-weight: 700; line-height: 1.3; }
  .q mark { background: #fde68a; padding: 0 6px; border-radius: 6px; }
  .o { margin-top: 14px; padding: 16px 20px; border: 2px solid var(--line); border-radius: 14px; font-size: 21px; color: #334155; }
  .o.ok { border-color: #6ee7b7; background: #ecfdf5; color: #065f46; }
  .note { position: absolute; left: 1020px; top: 300px; font-size: 44px; transform: rotate(-6deg); color: #b45309; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="card scr">
    <div class="top"><span>Pregunta 18 / 30</span><span>12:40</span></div>
    <div class="bar"><i></i></div>
    <div class="q">Al girar, ¿debe ceder el paso a los peatones?</div>
    <div class="o"><mark>Únicamente</mark> si hay paso para peatones.</div>
    <div class="o ok">Sí, aunque no exista paso para peatones.</div>
    <div class="o">No, el giro tiene prioridad.</div>
  </div>
  <div class="note hand">одно слово — и ответ неверный</div>
  <div class="chip" style="left:1060px; top:560px; width:330px"><div class="n tabular">3 / 30</div><div class="t">ошибки — максимум</div></div>
</body></html>
