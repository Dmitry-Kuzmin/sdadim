<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { --glow: #dcfce7; }
  .laptop { left: 180px; top: 150px; width: 700px; padding: 0; transform: rotate(-3deg); overflow: hidden; }
  .laptop .bar { background: #f1f5f9; padding: 14px 20px; font-size: 16px; color: var(--muted); }
  .laptop .body { padding: 34px 40px; }
  .laptop h2 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .field { margin-top: 16px; padding: 14px 18px; border: 2px solid var(--line); border-radius: 12px; font-size: 19px; color: #334155; display: flex; justify-content: space-between; }
  .btn { margin-top: 22px; display: inline-block; padding: 14px 28px; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 700; font-size: 20px; }
  .cross { position: absolute; left: 1010px; top: 230px; width: 330px; padding: 28px; transform: rotate(5deg); }
  .cross .t1 { font-size: 26px; font-weight: 700; color: var(--soft); text-decoration: line-through; text-decoration-color: var(--red); }
  .note { position: absolute; left: 1000px; top: 560px; font-size: 44px; transform: rotate(-4deg); color: var(--green); }
</style></head>
<body>
  <div class="grid"></div>
  <div class="card laptop">
    <div class="bar">sede.dgt.gob.es</div>
    <div class="body">
      <h2>Examen teórico por libre</h2>
      <div class="field"><span>Permiso</span><b>B</b></div>
      <div class="field"><span>Tasa 2.1</span><b class="tabular">pagada ✓</b></div>
      <div class="field"><span>Idioma</span><b>Español</b></div>
      <span class="btn">Solicitar examen</span>
    </div>
  </div>
  <div class="card cross"><div class="eyebrow">Автошкола</div><div class="t1">Matrícula + теория</div></div>
  <div class="note hand">теория — сами, на русском</div>
</body></html>
