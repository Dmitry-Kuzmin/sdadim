<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { --glow: #fef3c7; }
  .plate { position: absolute; left: 260px; top: 200px; width: 380px; height: 380px; border-radius: 34px; background: #16a34a; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); transform: rotate(-6deg); }
  .plate span { font-size: 300px; font-weight: 900; color: #fff; line-height: 1; }
  .rules { left: 820px; top: 200px; width: 520px; padding: 34px 38px; transform: rotate(4deg); }
  .rules .row { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-bottom: 1px solid #f1f5f9; font-size: 22px; color: #334155; }
  .rules .row b { font-size: 34px; font-weight: 800; color: var(--ink); }
  .note { position: absolute; left: 860px; top: 700px; font-size: 42px; transform: rotate(-3deg); color: #b45309; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="plate"><span>L</span></div>
  <div class="card rules">
    <div class="eyebrow" style="margin-bottom:6px">Conductor novel</div>
    <div class="row"><span>Знак L</span><b>1 год</b></div>
    <div class="row"><span>Баллов</span><b>8</b></div>
    <div class="row" style="border:0"><span>Алкоголь, мг/л</span><b>0,15</b></div>
  </div>
  <div class="note hand">даже с 20 годами стажа</div>
</body></html>
