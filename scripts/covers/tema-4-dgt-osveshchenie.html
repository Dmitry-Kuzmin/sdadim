<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { --glow: #fef3c7; }
  .plate { position: absolute; left: 150px; top: 170px; width: 300px; height: 300px; border-radius: 34px; background: #d97706; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: var(--shadow); transform: rotate(-6deg); color: #fff; }
  .plate small { font-size: 34px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .plate span { font-size: 210px; font-weight: 900; line-height: .9; }
  .shot { position: absolute; left: 560px; top: 120px; width: 600px; border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); transform: rotate(3deg); border: 10px solid #fff; }
  .shot img { display: block; width: 100%; }
  .nums { left: 1060px; top: 520px; width: 420px; padding: 30px 36px; transform: rotate(-3deg); }
  .nums .row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-bottom: 1px solid #f1f5f9; font-size: 22px; color: #334155; }
  .nums .row b { font-size: 34px; font-weight: 800; color: var(--ink); }
  .title { position: absolute; left: 150px; top: 610px; width: 820px; font-size: 76px; font-weight: 800; line-height: 1.02; letter-spacing: -.02em; }
  .title em { font-style: normal; color: #d97706; }
  .note { position: absolute; left: 160px; top: 860px; font-size: 42px; transform: rotate(-2deg); color: #b45309; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="plate"><small>Тема</small><span>4</span></div>
  <div class="shot"><img src="../../public/assets/blog/tema-4-dgt-osveshchenie/high-beam.webp" alt=""></div>
  <div class="card nums">
    <div class="eyebrow" style="margin-bottom:6px">Alumbrado</div>
    <div class="row"><span>Плохой свет</span><b>10 · 50 м</b></div>
    <div class="row"><span>Дальний</span><b>> 40 км/ч</b></div>
    <div class="row" style="border:0"><span>Контурные</span><b>2,10 м</b></div>
  </div>
  <div class="title">Освещение: <em>ловушки</em> темы DGT</div>
  <div class="note hand">ближний, дальний, туман и тест</div>
</body></html>
