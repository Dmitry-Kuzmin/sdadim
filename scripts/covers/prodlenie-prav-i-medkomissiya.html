<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { --glow: #dbeafe; }
  .eye { left: 170px; top: 140px; width: 430px; padding: 40px; transform: rotate(-4deg); text-align: center; }
  .eye .l { font-weight: 800; color: var(--ink); letter-spacing: .2em; line-height: 1.35; }
  .lic { left: 760px; top: 220px; width: 500px; height: 312px; padding: 30px 34px; transform: rotate(4deg); }
  .lic .title { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .lic .photo { position: absolute; left: 34px; top: 86px; width: 120px; height: 150px; border-radius: 14px; background: linear-gradient(160deg, #e2e8f0, #cbd5e1); }
  .lic .f { position: absolute; left: 180px; font-size: 19px; color: #334155; }
  .lic .f b { color: var(--ink); }
  .stamp { position: absolute; left: 1080px; top: 560px; transform: rotate(-10deg); border: 5px solid var(--blue); color: var(--blue); border-radius: 16px; padding: 10px 22px; font-size: 34px; font-weight: 800; background: rgba(255,255,255,.9); }
  .note { position: absolute; left: 230px; top: 720px; font-size: 42px; transform: rotate(-3deg); }
</style></head>
<body>
  <div class="grid"></div>
  <div class="card eye">
    <div class="eyebrow" style="margin-bottom:18px">Centro de reconocimiento</div>
    <div class="l" style="font-size:96px">E</div>
    <div class="l" style="font-size:58px">F P</div>
    <div class="l" style="font-size:40px">T O Z</div>
    <div class="l" style="font-size:28px">L P E D</div>
    <div class="l" style="font-size:20px; color:#64748b">P E C F D</div>
  </div>
  <div class="card lic">
    <div class="title">Permiso de conducción</div>
    <div class="photo"></div>
    <div class="f" style="top:100px">4b. <b class="tabular">12.05.2036</b></div>
    <div class="f" style="top:142px">9. <b>B</b></div>
    <div class="f" style="top:184px">12. <b>01</b> · gafas</div>
  </div>
  <div class="stamp">APTO</div>
  <div class="note hand">+10 лет за одну явку</div>
</body></html>
