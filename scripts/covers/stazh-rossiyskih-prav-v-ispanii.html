<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { --glow: #dcfce7; }
  .doc { left: 160px; top: 110px; width: 520px; padding: 46px 48px; transform: rotate(-4deg); }
  .doc .seal { position: absolute; right: 44px; bottom: 44px; width: 120px; height: 120px; border-radius: 50%; border: 4px solid #1d4ed8; opacity: .55; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1d4ed8; text-align: center; letter-spacing: .06em; }
  .doc h2 { font-size: 30px; font-weight: 800; margin: 10px 0 26px; letter-spacing: -.02em; }
  .doc .l { height: 13px; border-radius: 7px; background: #e2e8f0; margin-bottom: 16px; }
  .plate { position: absolute; left: 820px; top: 230px; width: 250px; height: 250px; border-radius: 26px; background: #16a34a; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); transform: rotate(6deg); }
  .plate span { font-size: 190px; font-weight: 900; color: #fff; line-height: 1; }
  .cross { position: absolute; left: 790px; top: 340px; width: 320px; height: 22px; background: var(--red); border-radius: 11px; transform: rotate(-38deg); box-shadow: 0 6px 18px rgba(220,38,38,.35); }
  .pts { left: 1140px; top: 520px; width: 330px; padding: 30px; transform: rotate(-3deg); }
  .pts .row { display: flex; align-items: baseline; gap: 18px; }
  .pts .was { font-size: 70px; font-weight: 800; color: var(--soft); text-decoration: line-through; text-decoration-color: var(--red); }
  .pts .now { font-size: 110px; font-weight: 900; letter-spacing: -.04em; color: var(--green); }
  .note { position: absolute; left: 260px; top: 780px; font-size: 42px; transform: rotate(-2deg); }
</style></head>
<body>
  <div class="grid"></div>
  <div class="card doc">
    <div class="eyebrow">Consulado General de Rusia</div>
    <h2>Certificado del permiso de conducir</h2>
    <div class="l" style="width:92%"></div><div class="l" style="width:78%"></div><div class="l" style="width:86%"></div><div class="l" style="width:60%"></div><div class="l" style="width:70%"></div><div class="l" style="width:40%"></div>
    <div class="seal">SELLO<br>CONSULAR</div>
  </div>
  <div class="plate"><span>L</span></div>
  <div class="cross"></div>
  <div class="card pts"><div class="eyebrow">Баллы</div><div class="row"><span class="was tabular">8</span><span class="now tabular">12</span></div></div>
  <div class="note hand">стаж засчитан ✓</div>
</body></html>
