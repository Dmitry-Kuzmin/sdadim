<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { --glow: #dbeafe; }
  .map { left: 500px; top: 110px; width: 860px; height: 780px; border-radius: 32px; overflow: hidden; }
  .map svg { position: absolute; inset: 0; }
  .pin { position: absolute; background: #fff; border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow-sm); font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .pin i { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-style: normal; font-size: 14px; font-weight: 700; }
  .timer { left: 1250px; top: 360px; width: 250px; padding: 24px; transform: rotate(4deg); }
  .timer .n { font-size: 60px; font-weight: 800; letter-spacing: -.03em; }
  .timer .t { font-size: 18px; color: #475569; }
  .note { position: absolute; left: 1020px; top: 60px; font-size: 34px; transform: rotate(-4deg); }
</style></head>
<body>
  <div class="grid"></div>
  <div class="card map">
    <svg viewBox="0 0 860 780">
      <rect width="860" height="780" fill="#f8fafc"/>
      <!-- кварталы -->
      <g fill="#eef2f7">
        <rect x="40" y="40" width="200" height="150" rx="14"/><rect x="290" y="40" width="240" height="150" rx="14"/><rect x="580" y="40" width="240" height="150" rx="14"/>
        <rect x="40" y="250" width="200" height="200" rx="14"/><rect x="580" y="250" width="240" height="200" rx="14"/>
        <rect x="40" y="510" width="200" height="230" rx="14"/><rect x="290" y="510" width="240" height="230" rx="14"/><rect x="580" y="510" width="240" height="230" rx="14"/>
      </g>
      <rect x="600" y="270" width="200" height="160" rx="12" fill="#dcfce7"/>
      <!-- дороги -->
      <g stroke="#ffffff" stroke-width="44" fill="none" stroke-linecap="round">
        <path d="M 0 220 H 860"/><path d="M 0 480 H 860"/><path d="M 265 0 V 780"/><path d="M 555 0 V 780"/>
      </g>
      <!-- кольцо -->
      <circle cx="410" cy="350" r="92" fill="none" stroke="#ffffff" stroke-width="44"/>
      <circle cx="410" cy="350" r="62" fill="#dcfce7"/>
      <!-- маршрут -->
      <path d="M 120 480 H 265 V 220 H 340 A 92 92 0 1 1 410 442 V 480 H 555 V 650 H 700"
            fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"/>
      <circle cx="120" cy="480" r="16" fill="#2563eb"/><circle cx="120" cy="480" r="7" fill="#fff"/>
      <circle cx="700" cy="650" r="16" fill="#0f172a"/>
      <!-- парковка -->
      <rect x="720" y="620" width="60" height="60" rx="12" fill="#2563eb"/>
      <text x="750" y="662" font-family="Inter" font-weight="800" font-size="34" fill="#fff" text-anchor="middle">P</text>
    </svg>
    <div class="pin" style="left:60px; top:520px"><i style="background:var(--blue)">1</i>Salida</div>
    <div class="pin" style="left:470px; top:250px"><i style="background:var(--amber)">2</i>Glorieta</div>
    <div class="pin" style="left:560px; top:700px"><i style="background:var(--ink)">3</i>Aparcamiento</div>
  </div>
  <div class="card timer"><div class="n tabular">25–30</div><div class="t">минут в реальном городе</div></div>
  <div class="chip" style="left:110px; top:330px; width:300px"><div class="n">1-й раз</div><div class="t">как сдать практику без пересдач</div></div>
  <div class="chip" style="left:150px; top:570px; width:300px"><div class="t" style="margin:0"><span class="dot" style="background:var(--amber)"></span><b>Экзаменатор</b><br>на заднем сиденье</div></div>
  <div class="note hand">смотри в зеркала!</div>
</body></html>
