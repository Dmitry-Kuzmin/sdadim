name: SEO Guard

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # npm install, как на Vercel: npm ci падает на lock-файле из macOS
      # (npm теряет Linux-зависимости wasm-сборок @emnapi/* — известный баг npm)
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (Astro) + SEO assert
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
